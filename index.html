<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국민대 학식 품절 알리미</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --primary: #2563eb;
      --danger: #ef4444; --warn: #f59e0b; --ok: #10b981; --text: #1f2937;
    }
    *, *::before, *::after { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header {
      background: #111827; color: #fff; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    header h1 { margin: 0; font-size: 1.2rem; }
    .container { max-width: 960px; margin: 20px auto; padding: 0 16px 40px; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; transition: 0.15s;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid #d1d5db; }
    .btn-heart { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .btn-heart.liked { background: #e11d48; color: #fff; cursor: not-allowed; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    select { padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; }

    /* 천원의 아침밥 배너 */
    .breakfast-banner {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff;
      border-radius: 14px; padding: 18px; margin-bottom: 20px;
    }
    .breakfast-banner.closed {
      background: linear-gradient(135deg, #475569, #64748b);
    }
    .progress-bar { background: rgba(255,255,255,0.25); height: 12px; border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .progress-fill { background: #fde047; height: 100%; transition: width 0.3s; }

    /* 메뉴 카드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); border-radius: 14px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 2px solid transparent; position: relative;
      display: flex; flex-direction: column;
    }
    .card.allergy-alert { border-color: var(--danger); background: #fff5f5; }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .corner-tag { font-size: 0.8rem; font-weight: 700; color: var(--primary); background: #eff6ff; padding: 4px 8px; border-radius: 6px; }
    .kcal-tag { font-size: 0.78rem; color: #6b7280; background: #f3f4f6; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

    /* 빨간 알레르기 경고등 */
    .allergy-light {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px;
      background: #fee2e2; color: #b91c1c; font-weight: 700; font-size: 0.82rem;
      padding: 5px 10px; border-radius: 99px; width: fit-content;
    }
    .red-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--danger);
      box-shadow: 0 0 8px var(--danger); animation: blink 1s infinite; flex-shrink: 0;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .menu-list { font-size: 0.93rem; line-height: 1.5; margin: 8px 0 12px; white-space: pre-line; flex: 1; }
    .meta-box { background: #f9fafb; border-radius: 8px; padding: 10px; font-size: 0.84rem; margin-bottom: 12px; }
    .meta-muted { background: #f3f4f6; color: #6b7280; border-radius: 8px; padding: 10px; font-size: 0.82rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 40px 16px;
      background: #fff; border-radius: 14px; color: #6b7280; font-size: 0.95rem;
    }
    .disclaimer {
      margin-top: 24px; font-size: 0.8rem; color: #6b7280; line-height: 1.5;
    }

    /* 로그인 모달 */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; padding: 22px; border-radius: 14px; width: 92%; max-width: 420px; }
    .allergy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .allergy-chip {
      display: flex; align-items: center; gap: 4px; font-size: 0.85rem;
      border: 1px solid #d1d5db; padding: 6px 8px; border-radius: 8px; cursor: pointer;
    }
    input[type="email"], input[type="text"] {
      width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px; margin: 6px 0 12px;
    }
    .email-row { display: flex; gap: 6px; align-items: center; margin: 6px 0 12px; }
    .email-row input[type="email"] { margin: 0; flex: 1; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff;
      padding: 12px 18px; border-radius: 10px; font-size: 0.88rem; display: none; z-index: 200;
      max-width: 340px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ 국민대 학식 품절 & 알레르기 알리미</h1>
    <div id="authArea"></div>
  </header>

  <div class="container">
    <!-- 천원의 아침밥 수량 현황 -->
    <section class="breakfast-banner" id="breakfastBox"></section>

    <div class="controls">
      <select id="cafeteriaSelect"></select>
      <select id="dateSelect"></select>
      <span id="statusText" style="font-size:0.85rem; color:#6b7280;"></span>
    </div>

    <div class="grid" id="menuGrid"></div>

    <p class="disclaimer">
      ※ 알레르기 경고는 메뉴명 키워드 기반 추정이며, 소스·조미료 등 숨은 원재료가 포함될 수 있으므로 정확한 정보는 식당 영양사실에 확인하세요.<br />
      ※ 품절 예상 시간 및 추정 칼로리는 참고용 모델 계산값입니다.
    </p>
  </div>

  <!-- 로그인 & 알레르기 설정 모달 -->
  <div class="modal-bg" id="loginModal">
    <div class="modal">
      <h3 style="margin-top:0;">로그인 및 알레르기 설정</h3>
      <label>이메일 (품절 30분 전 알림 수신용)</label>
      <div class="email-row">
        <input type="email" id="loginEmail" placeholder="student@kookmin.ac.kr" />
        <button type="button" class="btn btn-outline" id="loadUserBtn" onclick="loadSavedUser()" style="white-space:nowrap;">불러오기</button>
      </div>
      <label>이름/닉네임</label>
      <input type="text" id="loginName" placeholder="국민인" />
      <label>알레르기 유발 식재료 선택 (해당 메뉴에 빨간 경고등 표시)</label>
      <div class="allergy-grid" id="allergyCheckboxes"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
        <button class="btn btn-outline" onclick="closeLogin()">취소</button>
        <button class="btn btn-primary" id="saveLoginBtn" onclick="saveLogin()">저장 및 로그인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // AWS Lambda Function URL (DynamoDB kmu_users 연동)
    const USER_API_URL = "https://3fdsjtbhvgng4lgjyaj5doccmm0ldgoa.lambda-url.ap-southeast-2.on.aws/";

    // 1. 알레르기 키워드 매핑 사전
    const ALLERGY_MAP = {
      "대두": ["두부", "순두부", "두유", "된장", "청국장", "콩나물", "콩비지", "유부", "간장", "콩"],
      "계란": ["계란", "달걀", "후라이", "에그", "메추리알", "오므라이스", "마요", "계란말이", "계란찜", "감자전", "단호박전", "동그랑땡"],
      "우유": ["우유", "치즈", "크림", "요거트", "요구르트", "버터", "모카", "푸딩", "로제"],
      "밀": ["빵", "국수", "칼국수", "우동", "라면", "파스타", "돈가스", "돈까스", "만두", "떡볶이", "수제비", "파이", "샌드위치", "핫도그", "전병"],
      "돼지고기": ["돼지", "돈육", "삼겹", "제육", "돈가스", "돈까스", "수육", "햄", "소시지", "소세지", "스팸", "순대", "부대찌개"],
      "쇠고기": ["소고기", "쇠고기", "우삼겹", "규동", "육개장", "불고기", "함박", "떡갈비", "미트볼"],
      "닭고기": ["닭", "치킨", "백숙", "찜닭", "닭곰탕", "닭갈비", "깐풍기"],
      "해산물": ["새우", "크래미", "오징어", "쭈꾸미", "어묵", "해물", "생선", "북어", "참치", "맛살"],
      "견과류": ["견과", "땅콩", "호두", "아몬드"]
    };

    // 2. 메뉴 키워드 기반 추정 칼로리 사전
    const KCAL_RULES = [
      ["돈가스", 780], ["돈까스", 780], ["스테이크", 760], ["파스타", 720], ["백숙", 700],
      ["덮밥", 680], ["볶음밥", 650], ["국밥", 620], ["부대찌개", 720], ["찌개", 580],
      ["라면", 540], ["국수", 510], ["우동", 490], ["떡볶이", 560], ["샐러드", 340],
      ["주먹밥", 380], ["천원의 아침밥", 570]
    ];

    function safeGetStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}.${String(now.getDate()).padStart(2, "0")}`;
    }

    function compareDateWithToday(dateStr) {
      const match = String(dateStr).match(/(\d{4})[.\-](\d{2})[.\-](\d{2})/);
      if (!match) return "other";
      const targetKey = `${match[1]}.${match[2]}.${match[3]}`;
      const todayKey = getTodayKey();
      if (targetKey === todayKey) return "today";
      return targetKey > todayKey ? "future" : "past";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 3. 상태 관리
    const TODAY_KEY = getTodayKey();
    let menuData = null;
    let currentUser = safeGetStorage("kmu_user", null);
    let heartDB = safeGetStorage("kmu_hearts", {});
    let soldOutReports = safeGetStorage("kmu_soldout", {});
    let breakfastCheckedUsers = safeGetStorage(`kmu_breakfast_users_${TODAY_KEY}`, []);
    if (!Array.isArray(breakfastCheckedUsers)) breakfastCheckedUsers = [];

    const FALLBACK_DATA = {
      updated_at: "샘플 모드",
      cafeterias: [
        {
          name: "학생식당(복지관 1층)",
          dates: [TODAY_KEY],
          corners: [
            {
              corner: "천원의 아침밥",
              menus: { [TODAY_KEY]: { items: ["순두부계란국", "돈육볶음", "양배추쌈*쌈장", "쌀밥/도시락김", "국민두유"], price: "￦1000" } }
            },
            {
              corner: "가마 중식",
              menus: { [TODAY_KEY]: { items: ["뚝)돼지고기순두부찌개", "쌀밥", "떡산적스테이크", "콩나물무침"], price: "￦5200" } }
            }
          ]
        }
      ]
    };

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = "none"; }, 3200);
    }

    function estimateKcal(text) {
      for (const [kw, kcal] of KCAL_RULES) {
        if (text.includes(kw)) return kcal;
      }
      return 550;
    }

    function detectAllergies(text) {
      if (!currentUser || !Array.isArray(currentUser.allergies) || !currentUser.allergies.length) return [];
      const hits = [];
      for (const allergen of currentUser.allergies) {
        const keywords = ALLERGY_MAP[allergen] || [];
        const matched = keywords.filter(kw => text.includes(kw));
        if (matched.length > 0) hits.push(`${allergen}(${matched[0]})`);
      }
      return hits;
    }

    // 품절 예상 시간 및 30분 전 알림 시간 계산 (조식 / 중식 / 중석식 / 석식 분리)
    function predictSoldOut(cornerName, menuText, heartCount, isSoldOut) {
      if (isSoldOut) return { mealLabel: "", soldOutStr: "품절됨", alertStr: "-" };

      const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const isBreakfast = cornerName.includes("아침") || cornerName.includes("조식");
      const hasLunch = cornerName.includes("중식") || menuText.includes("[중식]");
      const hasDinner = cornerName.includes("석식") || menuText.includes("[석식]");
      const isLunchDinner = menuText.includes("[중석식]");

      let mealLabel = "중식 기준";
      let baseMin = 13 * 60 + 40;
      let minBound = 12 * 60 + 10;

      if (isBreakfast) {
        mealLabel = "조식 기준";
        baseMin = 9 * 60 + 20;
        minBound = 8 * 60 + 30;
      } else if ((hasDinner && !hasLunch && !isLunchDinner) || (hasDinner && nowMins >= 15 * 60)) {
        mealLabel = "석식 기준";
        baseMin = 18 * 60 + 15;
        minBound = 17 * 60 + 30;
      } else if (isLunchDinner && !hasLunch) {
        mealLabel = "중·석식 기준";
        baseMin = 18 * 60;
        minBound = 16 * 60 + 30;
      }

      const predictedMin = Math.max(minBound, baseMin - heartCount * 2);
      const alertMin = predictedMin - 30;
      const fmt = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

      return { mealLabel, soldOutStr: fmt(predictedMin), alertStr: fmt(alertMin) };
    }

    // 천원의 아침밥 배너 렌더링
    function renderBreakfastBanner() {
      const box = document.getElementById("breakfastBox");
      const totalQuota = 150;
      const now = new Date();
      const day = now.getDay();
      const mins = now.getHours() * 60 + now.getMinutes();

      const isWeekend = day === 0 || day === 6;
      const isBeforeOpen = !isWeekend && mins < 480;
      const isOpen = !isWeekend && mins >= 480 && mins <= 600;
      const hasChecked = currentUser && breakfastCheckedUsers.includes(currentUser.email);

      let remaining = 0;
      let statusDesc = "";
      let btnLabel = "방금 먹었어요";
      let btnDisabled = false;

      if (isWeekend) {
        remaining = 0;
        statusDesc = "주말에는 천원의 아침밥을 운영하지 않습니다.";
        btnLabel = "주말 미운영";
        btnDisabled = true;
      } else if (isBeforeOpen) {
        remaining = totalQuota;
        statusDesc = `오픈 전 · 준비 수량 <strong style="font-size:1.15rem; color:#fde047;">${totalQuota}개</strong> (08:00 시작)`;
        btnLabel = "08:00 오픈";
        btnDisabled = true;
      } else if (isOpen) {
        const elapsedRatio = (mins - 480) / 120;
        remaining = Math.max(0, Math.round(totalQuota * (1 - elapsedRatio)) - breakfastCheckedUsers.length);
        const pct = Math.round((remaining / totalQuota) * 100);
        if (remaining === 0) {
          statusDesc = `오늘 수량이 모두 소진되었습니다 (0 / ${totalQuota}개)`;
          btnLabel = "오늘 마감";
          btnDisabled = true;
        } else {
          statusDesc = `예상 잔여 수량: <strong style="font-size:1.2rem; color:#fde047;">${remaining}개</strong> / ${totalQuota}개 (${pct}%)`;
          if (hasChecked) {
            btnLabel = "오늘 체크 완료";
            btnDisabled = true;
          }
        }
      } else {
        remaining = 0;
        statusDesc = `오늘 운영이 마감되었습니다 (평일 08:00~10:00)`;
        btnLabel = "오늘 마감";
        btnDisabled = true;
      }

      const pct = Math.round((remaining / totalQuota) * 100);
      box.className = `breakfast-banner ${(!isOpen && !isBeforeOpen) || remaining === 0 ? "closed" : ""}`;
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <strong>🌅 천원의 아침밥 (학생식당 평일 08:00~10:00)</strong>
            <div style="font-size:0.9rem; opacity:0.95; margin-top:4px;">${statusDesc}</div>
          </div>
          <button class="btn btn-outline" id="breakfastCheckBtn" ${btnDisabled ? "disabled" : ""}>${btnLabel}</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <small style="opacity:0.85;">※ 시간대별 소진 예측과 학생 체크인을 합산한 추정 수량입니다 (계정당 1일 1회 체크).</small>
      `;

      const checkBtn = document.getElementById("breakfastCheckBtn");
      if (checkBtn && !btnDisabled) {
        checkBtn.addEventListener("click", reportBreakfastEat);
      }
    }

    function reportBreakfastEat() {
      if (!currentUser) {
        showToast("중복 방지를 위해 로그인 후 체크할 수 있습니다.");
        return openLogin();
      }
      if (breakfastCheckedUsers.includes(currentUser.email)) {
        return showToast("오늘은 이미 체크하셨습니다.");
      }
      breakfastCheckedUsers.push(currentUser.email);
      localStorage.setItem(`kmu_breakfast_users_${TODAY_KEY}`, JSON.stringify(breakfastCheckedUsers));
      renderBreakfastBanner();
      showToast("천원의 아침밥 잔여 수량에 반영되었습니다.");
    }

    // 로그인 UI
    function renderAuth() {
      const area = document.getElementById("authArea");
      if (currentUser) {
        const allergies = Array.isArray(currentUser.allergies) ? currentUser.allergies : [];
        const allergyTxt = allergies.length ? allergies.join(", ") : "없음";
        area.innerHTML = `
          <span style="font-size:0.85rem; margin-right:8px;">
            ${escapeHtml(currentUser.name || "국민인")} (${escapeHtml(currentUser.email || "")}) | 알레르기: <strong>${escapeHtml(allergyTxt)}</strong>
          </span>
          <button class="btn btn-outline" onclick="openLogin()">설정</button>
          <button class="btn btn-primary" onclick="logout()">로그아웃</button>
        `;
      } else {
        area.innerHTML = `<button class="btn btn-primary" onclick="openLogin()">로그인 / 알레르기 설정</button>`;
      }
    }

    function openLogin() {
      document.getElementById("loginEmail").value = currentUser?.email || "";
      document.getElementById("loginName").value = currentUser?.name || "";
      const saved = Array.isArray(currentUser?.allergies) ? currentUser.allergies : [];
      const box = document.getElementById("allergyCheckboxes");
      box.innerHTML = Object.keys(ALLERGY_MAP).map(a => `
        <label class="allergy-chip">
          <input type="checkbox" value="${a}" ${saved.includes(a) ? "checked" : ""} />
          ${a}
        </label>
      `).join("");
      document.getElementById("loginModal").classList.add("open");
    }

    function closeLogin() { document.getElementById("loginModal").classList.remove("open"); }

    // AWS DynamoDB에서 기존 계정 정보 불러오기
    async function loadSavedUser() {
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      if (!email || !email.includes("@")) return alert("조회할 이메일을 입력하세요.");

      const btn = document.getElementById("loadUserBtn");
      btn.disabled = true;
      btn.textContent = "조회 중...";

      try {
        const res = await fetch(`${USER_API_URL}?email=${encodeURIComponent(email)}`);
        if (res.status === 404) return showToast("저장된 계정이 없습니다. 새로 입력 후 저장하세요.");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const { user } = await res.json();
        document.getElementById("loginName").value = user.name || "";
        const savedAllergies = user.allergies || [];
        document.querySelectorAll("#allergyCheckboxes input").forEach(cb => {
          cb.checked = savedAllergies.includes(cb.value);
        });
        showToast("AWS DB에서 기존 알레르기 설정을 불러왔습니다.");
      } catch (e) {
        console.error(e);
        showToast("DB 조회 중 오류가 발생했습니다. 개발자 도구(F12) 콘솔을 확인하세요.");
      } finally {
        btn.disabled = false;
        btn.textContent = "불러오기";
      }
    }

    // AWS DynamoDB에 회원 정보 저장 및 로그인
    async function saveLogin() {
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const name = document.getElementById("loginName").value.trim() || "국민인";
      if (!email || !email.includes("@")) return alert("알림을 받을 올바른 이메일을 입력하세요.");
      const allergies = [...document.querySelectorAll("#allergyCheckboxes input:checked")].map(el => el.value);

      const btn = document.getElementById("saveLoginBtn");
      btn.disabled = true;
      btn.textContent = "저장 중...";

      try {
        const res = await fetch(USER_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ email, name, allergies })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        currentUser = { email, name, allergies };
        localStorage.setItem("kmu_user", JSON.stringify(currentUser));
        closeLogin();
        renderAuth();
        renderBreakfastBanner();
        renderMenus();
        showToast(`${name}님 로그인 정보가 AWS DB에 저장되었습니다.`);
      } catch (e) {
        console.error(e);
        alert("AWS DB 저장에 실패했습니다. F12 콘솔 에러 메시지를 확인해 주세요.");
      } finally {
        btn.disabled = false;
        btn.textContent = "저장 및 로그인";
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("kmu_user");
      renderAuth();
      renderBreakfastBanner();
      renderMenus();
    }

    function pressHeart(menuId, cornerName, menuText) {
      if (!currentUser) {
        showToast("하트 및 30분 전 알림 예약은 로그인 후 이용할 수 있습니다.");
        return openLogin();
      }
      const list = heartDB[menuId] || [];
      if (list.includes(currentUser.email)) {
        return showToast("이미 하트를 누른 메뉴입니다. (계정당 1회 제한)");
      }
      list.push(currentUser.email);
      heartDB[menuId] = list;
      localStorage.setItem("kmu_hearts", JSON.stringify(heartDB));

      const { soldOutStr, alertStr } = predictSoldOut(cornerName, menuText, list.length, false);
      renderMenus();
      showToast(`❤️ 하트 완료! 예상 품절(${soldOutStr}) 30분 전인 ${alertStr}에 ${currentUser.email}로 알림이 예약되었습니다.`);
    }

    function reportSoldOut(menuId) {
      if (!currentUser) {
        showToast("품절 제보는 로그인 후 이용할 수 있습니다.");
        return openLogin();
      }
      soldOutReports[menuId] = true;
      localStorage.setItem("kmu_soldout", JSON.stringify(soldOutReports));
      renderMenus();
      showToast("실시간 품절 상태로 업데이트되었습니다.");
    }

    function renderMenus() {
      const cafIdx = document.getElementById("cafeteriaSelect").value;
      const dateStr = document.getElementById("dateSelect").value;
      const caf = menuData.cafeterias[cafIdx];
      const grid = document.getElementById("menuGrid");
      grid.innerHTML = "";

      if (!caf) return;

      const dateStatus = compareDateWithToday(dateStr);
      const isToday = dateStatus === "today";
      let renderedCount = 0;

      caf.corners.forEach(c => {
        const dayMenu = c.menus[dateStr];
        if (!dayMenu) return;
        renderedCount += 1;

        const menuText = dayMenu.items.join("\n");
        const fullSearchText = `${c.corner} ${menuText}`;
        const menuId = `${caf.name}_${c.corner}_${dateStr}`;
        const hearts = heartDB[menuId] || [];
        const hasLiked = currentUser && hearts.includes(currentUser.email);
        const isSoldOut = Boolean(soldOutReports[menuId]);

        const allergyHits = detectAllergies(fullSearchText);
        const kcal = estimateKcal(fullSearchText);

        const card = document.createElement("div");
        card.className = `card ${allergyHits.length ? "allergy-alert" : ""}`;

        let bottomHtml = "";
        if (isToday) {
          const { mealLabel, soldOutStr, alertStr } = predictSoldOut(c.corner, menuText, hearts.length, isSoldOut);
          bottomHtml = `
            <div class="meta-box">
              ⏱️ 품절 예상${mealLabel ? ` (${mealLabel})` : ""}: <strong>${soldOutStr}</strong><br />
              🔔 하트 시 알림 예정: <strong>${alertStr}</strong>${alertStr !== "-" ? " (30분 전)" : ""}
            </div>
            <div class="card-footer">
              <button class="btn btn-heart ${hasLiked ? "liked" : ""}" data-action="heart">
                ${hasLiked ? "❤️ 알림 예약됨" : "🤍 하트"} (${hearts.length})
              </button>
              <button class="btn btn-outline" data-action="soldout" ${isSoldOut ? "disabled" : ""}>
                ${isSoldOut ? "품절됨" : "품절 제보"}
              </button>
            </div>
          `;
        } else {
          const noticeMsg = dateStatus === "future"
            ? "📅 예정된 식단입니다 (품절 예측·알림은 당일 제공)"
            : "종료된 날짜의 식단입니다";
          bottomHtml = `<div class="meta-muted">${noticeMsg}</div>`;
        }

        card.innerHTML = `
          <div class="card-header">
            <span class="corner-tag">${escapeHtml(c.corner)} ${escapeHtml(dayMenu.price || "")}</span>
            <span class="kcal-tag">약 ${kcal} kcal</span>
          </div>
          ${allergyHits.length ? `
            <div class="allergy-light">
              <span class="red-dot"></span>
              알레르기 주의: ${escapeHtml(allergyHits.join(", "))}
            </div>
          ` : ""}
          <div class="menu-list">${escapeHtml(menuText)}</div>
          ${bottomHtml}
        `;

        if (isToday) {
          card.querySelector('[data-action="heart"]').addEventListener("click", () => {
            pressHeart(menuId, c.corner, menuText);
          });
          card.querySelector('[data-action="soldout"]').addEventListener("click", () => {
            reportSoldOut(menuId);
          });
        }

        grid.appendChild(card);
      });

      if (renderedCount === 0) {
        grid.innerHTML = `<div class="empty-state">선택한 날짜(${escapeHtml(dateStr)})에는 운영되는 메뉴가 없습니다.</div>`;
      }
    }

    async function init() {
      renderAuth();
      renderBreakfastBanner();

      try {
        const res = await fetch("./menu.json", { cache: "no-store" });
        if (!res.ok) throw new Error("No menu.json");
        menuData = await res.json();
        document.getElementById("statusText").textContent = `국민대 홈페이지 동기화: ${menuData.updated_at}`;
      } catch {
        menuData = FALLBACK_DATA;
        document.getElementById("statusText").textContent = "menu.json 대기 중 (샘플 식단 표시)";
      }

      const cafSelect = document.getElementById("cafeteriaSelect");
      cafSelect.innerHTML = menuData.cafeterias.map((c, i) => `<option value="${i}">${escapeHtml(c.name)}</option>`).join("");
      cafSelect.onchange = updateDateDropdown;
      updateDateDropdown();
    }

    function updateDateDropdown() {
      const caf = menuData.cafeterias[document.getElementById("cafeteriaSelect").value];
      const dateSelect = document.getElementById("dateSelect");
      dateSelect.innerHTML = caf.dates.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");

      const todayMatch = caf.dates.find(d => compareDateWithToday(d) === "today");
      if (todayMatch) dateSelect.value = todayMatch;

      dateSelect.onchange = renderMenus;
      renderMenus();
    }

    init();
  </script>
</body>
</html>
