<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국민대 학식 품절 알리미</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --primary: #2563eb;
      --danger: #ef4444; --warn: #f59e0b; --ok: #10b981; --text: #1f2937;
    }
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header {
      background: #111827; color: #fff; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    header h1 { margin: 0; font-size: 1.2rem; }
    .container { max-width: 960px; margin: 20px auto; padding: 0 16px 40px; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; transition: 0.15s;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid #d1d5db; }
    .btn-heart { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .btn-heart.liked { background: #e11d48; color: #fff; cursor: not-allowed; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    select { padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; }

    /* 천원의 아침밥 배너 */
    .breakfast-banner {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff;
      border-radius: 14px; padding: 18px; margin-bottom: 20px;
    }
    .breakfast-banner.closed {
      background: linear-gradient(135deg, #475569, #64748b);
    }
    .progress-bar { background: rgba(255,255,255,0.25); height: 12px; border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .progress-fill { background: #fde047; height: 100%; transition: width 0.3s; }

    /* 메뉴 카드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); border-radius: 14px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 2px solid transparent; position: relative;
      display: flex; flex-direction: column;
    }
    .card.allergy-alert { border-color: var(--danger); background: #fff5f5; }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .corner-tag { font-size: 0.8rem; font-weight: 700; color: var(--primary); background: #eff6ff; padding: 4px 8px; border-radius: 6px; }
    .kcal-tag { font-size: 0.78rem; color: #6b7280; background: #f3f4f6; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

    /* 빨간 알레르기 경고등 */
    .allergy-light {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px;
      background: #fee2e2; color: #b91c1c; font-weight: 700; font-size: 0.82rem;
      padding: 5px 10px; border-radius: 99px; width: fit-content;
    }
    .red-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--danger);
      box-shadow: 0 0 8px var(--danger); animation: blink 1s infinite; flex-shrink: 0;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .menu-list { font-size: 0.93rem; line-height: 1.5; margin: 8px 0 12px; white-space: pre-line; flex: 1; }
    .meta-box { background: #f9fafb; border-radius: 8px; padding: 10px; font-size: 0.84rem; margin-bottom: 12px; }
    .meta-muted { background: #f3f4f6; color: #6b7280; border-radius: 8px; padding: 10px; font-size: 0.82rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 40px 16px;
      background: #fff; border-radius: 14px; color: #6b7280; font-size: 0.95rem;
    }
    .disclaimer {
      margin-top: 24px; font-size: 0.8rem; color: #6b7280; line-height: 1.5;
    }

    /* 로그인 모달 */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; padding: 22px; border-radius: 14px; width: 92%; max-width: 420px; }
    .allergy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .allergy-chip {
      display: flex; align-items: center; gap: 4px; font-size: 0.85rem;
      border: 1px solid #d1d5db; padding: 6px 8px; border-radius: 8px; cursor: pointer;
    }
    input[type="email"], input[type="text"] {
      width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px; margin: 6px 0 12px;
    }
    .email-row { display: flex; gap: 6px; align-items: center; margin: 6px 0 12px; }
    .email-row input[type="email"] { margin: 0; flex: 1; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff;
      padding: 12px 18px; border-radius: 10px; font-size: 0.88rem; display: none; z-index: 200;
      max-width: 340px; line-height: 1.4;
    }
  </style>
</head>
