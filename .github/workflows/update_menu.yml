name: Update KMU Menu

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "crawl.py"
      - ".github/workflows/update_menu.yml"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run crawler
        run: python crawl.py
      - name: Commit updated menu.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git diff --staged --quiet || git commit -m "chore: update daily menu.json"
          git push
